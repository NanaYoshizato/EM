# 開発用ファイル
# docker-compose.ymlファイルを上書きできる
services:
  backend:
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    # next devは起動時に環境変数を読むため、build.argsではなくenvironmentで渡せる
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_FIREBASE_API_KEY: dummy-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy-auth-domain
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-em-project
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: http://127.0.0.1:9099
