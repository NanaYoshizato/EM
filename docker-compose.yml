services:
  # 1. PostgreSQL データベース
  db:
    image: postgres:16-alpine
    container_name: em-db
    restart: always
    environment:
      POSTGRES_USER: johndoe
      POSTGRES_PASSWORD: randompassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U johndoe -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Hono バックエンド
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: em-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://johndoe:randompassword@db:5432/mydb?schema=public
      PORT: 3001
      JWT_SECRET: nsgB6sK39vvnsuiy
      FIREBASE_AUTH_EMULATOR_HOST: host.docker.internal:9099
      GCLOUD_PROJECT: demo-em-project
    depends_on:
      db:
        condition: service_healthy

  # フロントエンド(Next.js)はこのリポジトリでは管理しない。
  # 開発は別リポジトリ EMS-OverTech-Team/employee-management-system 側で行い、
  # そちらのdevサーバーのポート番号を見ながら、バックエンドはこのDockerで起動する。

volumes:
  pg-data:
